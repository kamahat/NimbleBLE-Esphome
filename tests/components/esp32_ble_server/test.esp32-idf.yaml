esphome:
  name: nimble-m5-esp32

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: ../../../components
    components: [esp32_ble, nimble_ble, ble_device_base, esp32_ble_server]

esp32_ble:

esp32_ble_server:
  manufacturer_data: [0x01, 0x02]
  services:
    - uuid: '12345678-1234-5678-1234-56789abcdef0'
      advertise: true
      characteristics:
        - id: test_char
          uuid: '12345678-1234-5678-1234-56789abcdef1'
          read: true
          write: true
          notify: true
          value: [0x00]
          on_write:
            then:
              - logger.log:
                  format: "characteristic written, conn=%u len=%u"
                  args: ['id', 'x.size()']
          descriptors:
            - uuid: '2901'
              read: true
              write: false
              value: "test characteristic"
  on_connect:
    then:
      - logger.log:
          format: "client connected, conn=%u"
          args: ['id']
  on_disconnect:
    then:
      - logger.log:
          format: "client disconnected, conn=%u"
          args: ['id']

logger:
  level: DEBUG
